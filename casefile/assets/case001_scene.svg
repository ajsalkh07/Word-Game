<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="c1_wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c1_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="c1_spotlight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wall & Floor -->
  <rect width="1200" height="420" fill="url(#c1_wall)"/>
  <rect y="420" width="1200" height="255" fill="url(#c1_floor)"/>
  
  <!-- Perspective Floor Tiles -->
  <path d="M 0 420 L 1200 420" stroke="#334155" stroke-width="2"/>
  <path d="M 150 420 L 0 675" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 350 420 L 200 675" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 600 420 L 600 675" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 850 420 L 1000 675" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 1050 420 L 1200 675" stroke="#1e293b" stroke-width="1.5"/>

  <!-- High Window on Right -->
  <rect x="840" y="80" width="180" height="220" rx="10" fill="#030712" stroke="#475569" stroke-width="4"/>
  <rect x="850" y="90" width="75" height="95" fill="#0f172a" opacity="0.8"/>
  <rect x="935" y="90" width="75" height="95" fill="#0f172a" opacity="0.8"/>
  <rect x="850" y="195" width="75" height="95" fill="#0f172a" opacity="0.8"/>
  <rect x="935" y="195" width="75" height="95" fill="#0f172a" opacity="0.8"/>
  <circle cx="930" cy="190" r="7" fill="#fbbf24"/> <!-- Window Latch -->

  <!-- Left Steel Vault Door -->
  <rect x="90" y="110" width="170" height="310" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
  <rect x="110" y="130" width="130" height="270" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Keypad & Lock -->
  <rect x="235" y="240" width="18" height="35" rx="3" fill="#020617" stroke="#475569"/>
  <circle cx="244" cy="250" r="3" fill="#ef4444"/> <!-- Red secure light -->

  <!-- Breaker Panel Box -->
  <rect x="280" y="200" width="80" height="120" rx="5" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <rect x="290" y="215" width="60" height="90" rx="3" fill="#1e293b"/>
  <polygon points="320,230 330,245 310,245" fill="#fbbf24"/> <!-- Warning triangle -->
  <circle cx="340" cy="270" r="4" fill="#94a3b8"/> <!-- Keyhole -->

  <!-- Hallway CCTV Camera Top Left -->
  <rect x="360" y="50" width="60" height="25" rx="4" fill="#475569"/>
  <polygon points="380,75 410,105 370,105" fill="#334155"/>
  <rect x="370" y="100" width="55" height="30" rx="6" fill="#1e293b" stroke="#64748b"/>
  <circle cx="415" cy="115" r="5" fill="#ef4444" filter="url(#c1_glow)"/> <!-- Recording LED -->

  <!-- Center Trophy Pedestal & Glass Case -->
  <rect x="520" y="320" width="160" height="150" rx="6" fill="#334155" stroke="#475569" stroke-width="3"/>
  <!-- Empty Glass Case (Broken lock / Open door) -->
  <rect x="535" y="170" width="130" height="150" rx="4" fill="none" stroke="rgba(148, 163, 184, 0.4)" stroke-width="4"/>
  <line x1="535" y1="170" x2="665" y2="320" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="600" cy="335" r="6" fill="#020617" stroke="#fbbf24" stroke-width="2"/> <!-- Picked Lock -->
  <!-- Ambient Spotlight on Pedestal -->
  <ellipse cx="600" cy="480" rx="140" ry="40" fill="url(#c1_spotlight)"/>

  <!-- Admin Desk on Right -->
  <polygon points="820,380 1080,380 1140,510 880,510" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="880" y="440" width="220" height="90" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Pried Drawer -->
  <rect x="900" y="455" width="85" height="32" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="935" y="468" width="15" height="5" rx="2" fill="#94a3b8"/> <!-- Handle with tool marks -->

  <!-- Wastebasket Far Right -->
  <polygon points="1070,540 1130,540 1115,610 1080,610" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

  <!-- Boot Print in Floor Wax -->
  <ellipse cx="580" cy="540" rx="16" ry="28" fill="#1e293b" opacity="0.7" transform="rotate(-15 580 540)"/>
  <ellipse cx="585" cy="570" rx="12" ry="12" fill="#1e293b" opacity="0.7" transform="rotate(-15 585 570)"/>
</svg>