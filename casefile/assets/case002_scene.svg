<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c2_leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="c2_wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#c2_bg)"/>

  <!-- Train Ceiling & Wall Paneling -->
  <rect x="0" y="0" width="1200" height="90" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="90" width="1200" height="280" fill="url(#c2_wood)"/>
  <rect x="0" y="370" width="1200" height="305" fill="#0f172a"/>

  <!-- Large Panoramic Train Window (Storm outside) -->
  <rect x="360" y="110" width="480" height="210" rx="14" fill="#020617" stroke="#92400e" stroke-width="8"/>
  <!-- Rain streaks -->
  <line x1="420" y1="130" x2="390" y2="280" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <line x1="560" y1="120" x2="530" y2="300" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <line x1="700" y1="140" x2="670" y2="290" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <line x1="780" y1="120" x2="750" y2="270" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <!-- Window cracked open 3 inches -->
  <rect x="800" y="110" width="40" height="210" fill="rgba(15, 23, 42, 0.9)"/>

  <!-- Overhead Luggage Rack -->
  <rect x="200" y="90" width="800" height="20" fill="#94a3b8" rx="3"/>
  <rect x="250" y="70" width="700" height="6" fill="#cbd5e1"/>
  <!-- Victor's Duffel Bag -->
  <rect x="300" y="45" width="120" height="45" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="52" x2="380" y2="52" stroke="#e2e8f0" stroke-width="3"/> <!-- Zipper partly open -->

  <!-- Analog Train Clock -->
  <circle cx="600" cy="65" r="32" fill="#fef3c7" stroke="#78350f" stroke-width="5"/>
  <line x1="600" y1="65" x2="600" y2="45" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="65" x2="616" y2="72" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Attendant Emergency Buzzer Left -->
  <rect x="120" y="180" width="35" height="50" rx="6" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <circle cx="137" cy="205" r="9" fill="#ef4444"/>

  <!-- Left Passenger Seats (Arthur's Seat 12A) -->
  <rect x="150" y="320" width="220" height="230" rx="16" fill="url(#c2_leather)" stroke="#9f1239" stroke-width="4"/>
  <rect x="180" y="430" width="180" height="150" rx="10" fill="url(#c2_leather)"/>
  <!-- Empty coat pocket impression -->
  <rect x="200" y="360" width="70" height="80" rx="6" fill="#4c0519"/>

  <!-- Right Passenger Seats (Clara's Seat 14B) -->
  <rect x="830" y="320" width="220" height="230" rx="16" fill="url(#c2_leather)" stroke="#9f1239" stroke-width="4"/>
  <rect x="840" y="430" width="180" height="150" rx="10" fill="url(#c2_leather)"/>
  <!-- Hanging Trench Coat on wall -->
  <polygon points="900,210 950,210 970,360 880,360" fill="#a16207" stroke="#78350f" stroke-width="2"/>
  <circle cx="925" cy="205" r="6" fill="#f59e0b"/> <!-- Hook -->

  <!-- Center Table between seats -->
  <polygon points="480,440 720,440 770,550 430,550" fill="url(#c2_wood)" stroke="#92400e" stroke-width="3"/>
  <rect x="580" y="550" width="40" height="100" fill="#451a03"/>

  <!-- Dropped Phone under table -->
  <rect x="630" y="580" width="40" height="22" rx="3" fill="#020617" stroke="#38bdf8" stroke-width="1.5" transform="rotate(25 630 580)"/>
  <!-- Ticket on carpet -->
  <rect x="420" y="590" width="35" height="18" fill="#fef08a" stroke="#ca8a04" transform="rotate(-15 420 590)"/>
</svg>