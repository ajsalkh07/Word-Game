<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0f172a"/>
  <!-- Metal wire basket frame -->
  <rect x="40" y="60" width="220" height="160" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="5"/>
  <line x1="40" y1="110" x2="260" y2="110" stroke="#64748b" stroke-width="3"/>
  <line x1="40" y1="160" x2="260" y2="160" stroke="#64748b" stroke-width="3"/>
  <!-- Blue silk thread snagged on wire -->
  <path d="M 120 110 Q 150 170 170 140 T 210 180" stroke="#0ea5e9" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Magnifying focus circle -->
  <circle cx="170" cy="145" r="45" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="150" y="260" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">BLUE SILK THREAD</text>
</svg>