<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0f172a"/>
  <!-- Paper Bill -->
  <rect x="60" y="30" width="180" height="240" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="2"/>
  <text x="150" y="65" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">GRAND AZURE HOTEL</text>
  <text x="150" y="80" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">ROOM SERVICE #402</text>
  <line x1="80" y1="95" x2="220" y2="95" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#1e293b">1x Wine ... $45</text>
  <text x="80" y="145" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#1e293b">1x Club ... $22</text>
  <line x1="80" y1="165" x2="220" y2="165" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Red Delivery Stamp -->
  <rect x="75" y="180" width="150" height="42" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" transform="rotate(-8 150 200)"/>
  <text x="150" y="198" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle" transform="rotate(-8 150 200)">DELIVERED 8:30 PM</text>
  <text x="150" y="214" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" fill="#ef4444" text-anchor="middle" transform="rotate(-8 150 200)">BY: RYAN</text>
</svg>