      </linearGradient>
    </defs>
    <!-- Background circle with metallic ring -->
    <circle cx="100" cy="100" r="96" fill="url(#bg_MIA)"/>
    <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

