<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0f172a"/>
  <!-- Phone body -->
  <rect x="75" y="25" width="150" height="250" rx="18" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <!-- Screen -->
  <rect x="85" y="45" width="130" height="210" rx="6" fill="#020617"/>
  <!-- Timestamp top bar -->
  <rect x="85" y="45" width="130" height="24" fill="#0f172a"/>
  <text x="95" y="61" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38bdf8">8:20 PM</text>
  <!-- Selfie mirror image inside phone -->
  <ellipse cx="150" cy="115" rx="28" ry="34" fill="#fed7aa"/>
  <rect x="120" y="150" width="60" height="50" rx="8" fill="#ec4899"/>
  <!-- Blue necklace on neck! -->
  <circle cx="150" cy="155" r="7" fill="#38bdf8" stroke="#fbbf24" stroke-width="2"/>
  <text x="150" y="235" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">NECKLACE VISIBLE</text>
</svg>